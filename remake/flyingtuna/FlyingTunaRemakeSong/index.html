<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/FA.css" />
    <title>Flyingtuna Remake Song Info</title>
  </head>

  <body>

    <div id="main_box" class="main_box">
      <div class="song_info">
        <div class="song_text" id="song_artist"></div>
        <div class="song_text" id="song_title"></div>
      </div>
      <div id="mapper_name" class="box mapper_box">
        <i style="font-size: 18px" class="fas fa-user"></i>
        <div id="mapper_name_txt" class="name_txt"></div>
        <div class="shadow"></div>
      </div>
      <div id="diff_name" class="box diff_name_box">
        <img style="width: auto; height: 18px;" src="images/circles.png">
        <div id="diff_name_txt" class="name_txt"></div>
        <div class="shadow"></div>
      </div>
    </div>
    <div class="sub_box_top hide" id="top">
      <table>
        <tr>
          <td class="percent">95<font style="color: #4C80DC;">%</font></td>
          <td class="percent">96<font style="color: #4C80DC;">%</font></td>
          <td class="percent">97<font style="color: #4C80DC;">%</font></td>
        </tr>
        <tr>
          <td class="percent_num" id="percent_num_95">0</td>
          <td class="percent_num" id="percent_num_96">0</td>
          <td class="percent_num" id="percent_num_97">0</td>
        </tr>
      </table>
    </div>
    <div class="sub_box_bottom hide" id="bottom">
      <table class="bottom">
        <tr>
          <td class="percent">98<font style="color: #4C80DC;">%</font></td>
          <td class="percent">99<font style="color: #4C80DC;">%</font></td>
          <td class="percent">100<font style="color: #4C80DC;">%</font></td>
        </tr>
        <tr>
          <td class="percent_num" id="percent_num_98">0</td>
          <td class="percent_num" id="percent_num_99">0</td>
          <td class="percent_num" id="percent_num_100">0</td>
        </tr>
      </table>
    </div>
  </body>
  <script type="module" src="index.js"></script>
</html>
